name: Release Obsidian plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Obsidian の手動インストールで使う配布用 ZIP を作成する。
      # worker は main.js にインライン埋め込み済みなので、ZIP には
      # main.js / manifest.json / styles.css だけを含める。
      - name: Package plugin ZIP
        run: |
          PLUGIN_NAME="obsidian-smart-pdf-mistral-plugin"
          mkdir -p "$PLUGIN_NAME"
          cp main.js "$PLUGIN_NAME/"
          cp manifest.json "$PLUGIN_NAME/"
          cp styles.css "$PLUGIN_NAME/"
          zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME/"

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          # 個別ファイル (BRAT / 個別DL用) と手動インストール用 ZIP の両方を添付。
          files: |
            main.js
            manifest.json
            styles.css
            obsidian-smart-pdf-mistral-plugin.zip
          generate_release_notes: true
